version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:00'
      timezone: Europe/Stockholm
    groups:
      npm-dependencies:
        patterns:
          - '*'
      # Group security fixes so one merge does not leave the other fixes behind main.
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # Obsidian 1.13.1 requires @codemirror/state 6.5.0 exactly.
      - dependency-name: '@codemirror/state'
      # typescript-eslint 8 requires typescript >=4.8.4 <6.1.0, so a major
      # typescript bump fails to install.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-obsidianmd 0.4.1 requires @eslint/js ^9.30.1, and
      # @eslint/js 10 requires eslint 10, so both fail to install.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:30'
      timezone: Europe/Stockholm
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
